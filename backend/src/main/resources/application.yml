server:
  port: 8080

spring:
  application:
    name: youfen-word-platform
  datasource:
    url: jdbc:h2:mem:youfen;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      encoding: UTF-8

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# 切 MySQL 时使用下面这段替换 datasource 段：
# spring.datasource.url=jdbc:mysql://localhost:3306/youfen?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
# spring.datasource.username=root
# spring.datasource.password=你的密码
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.hibernate.ddl-auto=update
# 并在 pom.xml 中把 h2 依赖替换为 mysql-connector-j
